name: Android CI

on:
  push:
    branches:
      - fastlane-test # Modify this if needed
      - dev
  pull_request:
    branches:
      - fastlane-test
      - dev

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04 # Updated to avoid brownout issues

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/gradle-build-action@v2

      - name: Install Ruby & Fastlane
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ruby-full
          gem install bundler
          bundle install || bundle update  # Ensure dependencies are properly installed

      - name: Run Fastlane Debug Build
        run: |
          bundle exec fastlane debug || fastlane debug  # Run Fastlane, retry if needed

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
